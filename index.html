<head>

<title>榮冠棒球學校模擬器</title>
<style>
:root{--bg:#091626;--panel:#12283d;--panel2:#183750;--line:#d7b76b;--gold:#ffd66b;--ink:#f7efd9;--muted:#9eb7c9;--red:#d75b6c;--blue:#4a91d2;--green:#72c98e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#102b42 65%,#07111f);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px}button,input,select{font:inherit}button{border:1px solid #e8ca80;background:linear-gradient(#284962,#142d43);color:#fff4d7;border-radius:7px;padding:9px 11px;cursor:pointer;box-shadow:0 2px 0 #050c15}button:active{transform:translateY(1px)}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:linear-gradient(#d7a948,#80551f);color:#20160a;font-weight:800}.danger{border-color:#e68c99;background:linear-gradient(#984455,#4c2638)}.good{border-color:#87d4a1;background:linear-gradient(#286b59,#183b3c)}.app{max-width:1100px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1.1fr .8fr .9fr 1fr;gap:6px;position:sticky;top:0;z-index:5;background:#0b1b2beF;padding:7px;border:2px solid var(--line);border-radius:10px}.stat{background:#122a40;border:1px solid #466078;padding:8px;border-radius:6px;min-width:0}.stat small{color:var(--muted);display:block}.stat strong{font-size:15px;color:var(--gold);overflow-wrap:anywhere}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.nav button{flex:1;min-width:90px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:9px}.panel{background:linear-gradient(135deg,#17354d,#0d2033);border:2px solid #bd9b58;border-radius:9px;padding:10px;box-shadow:inset 0 0 0 2px #294359;min-width:0}.panel h2,.panel h3{margin:0 0 9px;color:var(--gold)}h2{font-size:18px}h3{font-size:15px}.muted{color:var(--muted)}.gold{color:var(--gold)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.rookie{background:#f3e8cb;color:#203348;border:2px solid #c4a567;border-radius:7px;padding:7px;text-align:left;min-width:0}.rookie.selected{outline:3px solid #70db9c;background:#d8f3d7}.rookie canvas,.player canvas{width:42px;height:48px;image-rendering:pixelated;float:left;margin-right:6px;background:#d7e5e1;border:1px solid #50677b}.rookie b{font-size:13px}.rookie small{display:block;font-size:11px}.pill{display:inline-block;border:1px solid #607c91;border-radius:20px;padding:2px 7px;font-size:11px;color:#dce9f2}.tablewrap{overflow:auto;max-height:450px}.roster{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}.roster th{background:#d9e0e8;color:#172b40;position:sticky;top:0}.roster td{background:#f2e9d5;color:#25364a}.roster th,.roster td{padding:5px 6px;border:1px solid #b5a88b;text-align:center}.roster tr:nth-child(even) td{background:#e6ddc8}.player{display:flex;gap:8px;align-items:center}.player canvas{float:none;width:58px;height:64px}.log{max-height:210px;overflow:auto;font-size:12px;line-height:1.65}.log div{border-bottom:1px solid #27435a;padding:3px}.event{color:#a8e7b4}.dangertext{color:#ff9eaa}.bar{height:8px;background:#07121f;border-radius:8px;overflow:hidden;border:1px solid #476075}.bar i{display:block;height:100%;background:linear-gradient(90deg,#62d58d,#ffd363)}.diamond{width:130px;height:130px;position:relative;margin:10px auto;transform:rotate(45deg);border:2px solid #d7c47b;background:repeating-linear-gradient(45deg,#3b8058,#3b8058 8px,#34744e 8px,#34744e 16px)}.base{position:absolute;width:18px;height:18px;background:#fff6d9;border:2px solid #c7a866;transform:rotate(0deg)}.b1{right:-9px;top:calc(50% - 9px)}.b2{top:-9px;left:calc(50% - 9px)}.b3{left:-9px;top:calc(50% - 9px)}.home{bottom:-9px;left:calc(50% - 9px)}.base.on{background:#ffd85e;box-shadow:0 0 10px #ffda62}.diamondlabels{font-size:11px;text-align:center}.matchgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tactics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tactics button{min-height:48px}.score{font-size:22px;font-weight:900;color:var(--gold)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.modal{max-width:650px;width:100%;max-height:90vh;overflow:auto;background:#10253a;border:3px solid var(--gold);border-radius:12px;padding:16px;box-shadow:0 0 35px #000}.modal h2{text-align:center}.ceremony{text-align:center;background:radial-gradient(ellipse,#31466c,#0b1227 72%);border:3px double #f6d879;padding:24px 14px}.ceremony .trophy{font-size:60px;text-shadow:0 0 20px #ffeaa3}.ceremony h1{color:#ffe38a;font-size:27px;text-shadow:2px 2px #a3487b}.setup{max-width:500px;margin:9vh auto}.setup input{width:100%;padding:12px;border-radius:7px;border:1px solid #8ba5b8;background:#071725;color:white}.foot{color:#809eb3;text-align:center;font-size:11px;margin:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{color:#ffdd7a;font-size:11px}@media(max-width:700px){.app{padding:5px}.top{grid-template-columns:1fr 1fr;position:relative}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.matchgrid{grid-template-columns:1fr}.tablewrap{max-height:360px}.panel{padding:8px}.nav button{min-width:75px;padding:8px 5px;font-size:12px}.roster{font-size:11px}.stat strong{font-size:13px}.two{grid-template-columns:1fr}.diamond{width:110px;height:110px}}
</style></head>
<body><div class="app">
<div id="setup" class="panel setup"><h1 class="gold">⚾ 榮冠棒球學校模擬器</h1><p>打造你的棒球名門，從平凡新生一路挑戰甲子園！</p><label>請輸入學校名稱</label><input id="schoolInput" maxlength="18" placeholder="例如：榮冠高中"><p class="muted">單機存檔保存在此瀏覽器。適合手機直向遊玩。</p><button class="primary" style="width:100%" onclick="startGame()">創立棒球部</button></div>
<div id="game" class="hidden">
<header class="top"><div class="stat"><small>🏫 學校</small><strong id="schoolName">榮冠高中</strong></div><div class="stat"><small>🏅 學校聲譽</small><strong id="rep">默默無聞</strong></div><div class="stat"><small>💰 球隊資金</small><strong id="money">¥ 1,000,000</strong></div><div class="stat"><small>🌸 當前日期</small><strong id="date">第1年 4月</strong></div></header>
<nav class="nav"><button onclick="showTab('home')">🏠 球隊總覽</button><button onclick="showTab('roster')">👥 球員名單</button><button onclick="showTab('training')">🏋️ 練習訓練</button><button onclick="showTab('schedule')">📅 比賽日程</button><button onclick="showTab('records')">📜 事件紀錄</button><button onclick="saveGame()">💾 存檔</button><button onclick="loadGame()">📂 讀檔</button></nav>
<div id="view"></div><div class="foot">榮冠棒球學校模擬器 · 復古像素風單機原型 · 每次操作皆可在遊戲內完成</div>
</div></div><div id="modalRoot"></div>
<script>
const POS=['投手','捕手','一壘手','二壘手','三壘手','游擊手','左外野手','中外野手','右外野手'];
const PITCHES=['滑球','曲球','指叉球','變速球','噴射球'];
const PROTEAMS=['讀賣巨人','阪神虎','福岡軟銀鷹','歐力士猛牛','東京養樂多燕子','橫濱 DeNA 海灣之星','廣島東洋鯉魚','中日龍','千葉羅德海洋','埼玉西武獅','東北樂天金鷲','北海道日本火腿鬥士'];
const SURNAMES=['佐藤','鈴木','高橋','田中','伊藤','渡邊','山本','中村','小林','加藤','吉田','山田','松本','井上','木村','林','陳','張','王','李','森田','齋藤','石川','青木','藤田','岡田','池田','前田','橋本'];
const GIVEN=['翔太','蓮','悠真','大翔','陽斗','健太','拓海','陸','颯太','悠斗','大和','蒼空','亮介','海斗','龍之介','直樹','一真','勇人','春樹','康介','健翔','翼','智也','晴','悠人','達也'];
const REP=['默默無聞','弱小','准強豪','強豪','名門'];
const $=id=>document.getElementById(id); let G=null,activeTab='home',selectedRookies=[],currentMatch=null,matchPause=false,matchTimer=null;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)], clamp=(x,a=1,b=100)=>Math.max(a,Math.min(b,x));
function log(s){G.logs.unshift(`${G.year}年 ${G.month}月｜${s}`);G.logs=G.logs.slice(0,100)}
function newPlayer(year=1,forcedPos=null){let talent=Math.random()<.12?'天才型':'平庸型',gen=G?G.nextId++:1;let rookie=year===1;let cap=talent==='天才型'?rand(90,100):rand(60,70);let base=talent==='天才型'?rand(49,61):rand(37,50);let pos=forcedPos||pick(POS);let p={id:gen,name:pick(SURNAMES)+' '+pick(GIVEN),year,talent,cap,contact:base+rand(-5,5),power:base+rand(-6,7),speed:base+rand(-4,8),field:base+rand(-4,8),reputation:rand(8,24),spirit:rand(40,65),pos,overall:0,pitchSpeed:pos==='投手'?rand(talent==='天才型'?137:115,talent==='天才型'?150:132):0,control:pos==='投手'?rand(35,61):0,stamina:pos==='投手'?rand(48,72):0,pitches:[],pitchCount:0,face:{skin:pick(['#f2c9a5','#d9a079','#b97854','#f7d9b9']),hair:pick(['#24252c','#50352b','#b46b35','#d9bd72','#1b1d2a']),style:rand(0,3),eyes:rand(0,2)}};if(pos==='投手'){let n=rand(1,3);for(let i=0;i<n;i++)p.pitches.push({name:pick(PITCHES.filter(x=>!p.pitches.some(y=>y.name===x))),level:rand(1,5)})}return p}
function calc(p){return Math.round((p.contact+p.power+p.speed+p.field)/4)}
function startGame(){let name=$('schoolInput').value.trim()||'榮冠高中';G={school:name,rep:0,money:1000000,year:1,month:4,week:1,nextId:1,players:[],logs:[],championSummer:false,autumnScore:0,springQualified:false,winterDone:false,graduates:[],honors:[],trainingBoost:0,alumniBoost:0,events:{}};let pitchers=0;for(let i=0;i<15;i++){let pos=i<2?'投手':POS[(i-1)%9];if(i>=9)pos=pick(POS.filter(x=>x!=='投手'));let p=newPlayer(i<5?2:1,pos);p.year=i<5?2:1;if(pos==='投手')pitchers++;G.players.push(p)}G.players.forEach(p=>p.overall=calc(p));$('setup').classList.add('hidden');$('game').classList.remove('hidden');log('棒球部正式成立！獲得15名初始球員，包含至少兩名投手。');openEnrollment();render()}
function showTab(t){activeTab=t;render()}
function repName(){return REP[G.rep]}
function money(n){return '¥ '+Math.round(n).toLocaleString('en-US')}
function render(){if(!G)return;$('schoolName').textContent=G.school;$('rep').textContent=repName();$('money').textContent=money(G.money);$('date').textContent=`第${G.year}年 ${G.month}月`;let v=$('view');if(activeTab==='home')v.innerHTML=homeHTML();else if(activeTab==='roster')v.innerHTML=rosterHTML();else if(activeTab==='training')v.innerHTML=trainingHTML();else if(activeTab==='schedule')v.innerHTML=scheduleHTML();else v.innerHTML=recordsHTML();drawFaces();if(activeTab==='home')drawDiamond()}
function homeHTML(){let pitchers=G.players.filter(p=>p.pos==='投手').length;return `<div class="grid"><section class="panel"><h2>⚾ 球隊總覽</h2><div class="two"><div class="stat"><small>在校球員</small><strong>${G.players.length} 人</strong></div><div class="stat"><small>投手數</small><strong>${pitchers} 人</strong></div><div class="stat"><small>訓練加成</small><strong>+${G.trainingBoost}%</strong></div><div class="stat"><small>甲子園榮譽</small><strong>${G.honors.length} 次</strong></div></div><h3 style="margin-top:14px">📣 教練日誌</h3><p class="muted">每月安排訓練、迎接新生、參加大賽。球員能力會隨訓練緩慢成長。</p><div class="row"><button class="primary" onclick="advanceMonth()">前進下一個月 ▶</button><button onclick="trainingEvent()">安排特別訓練</button></div><h3 style="margin-top:14px">🧢 先發陣容預覽</h3><div id="diamond" class="hidden"></div><div id="miniRoster" class="cards">${G.players.slice(0,6).map(p=>`<div class="stat player"><canvas id="face${p.id}" width="48" height="56"></canvas><div><b>${p.name}</b><small>${p.pos} · ${p.year}年級</small><small>綜合 ${calc(p)}</small></div></div>`).join('')}</div></section><aside class="panel"><h2>🌟 球隊效果</h2><p>🎓 學校聲譽：<b class="gold">${repName()}</b></p><p>📈 球隊整體：<b>${Math.round(G.players.reduce((a,p)=>a+calc(p),0)/Math.max(1,G.players.length))}</b></p><p>💪 學長回娘家：<b class="gold">+${G.alumniBoost}%</b></p><p>🎯 訓練經驗加成：<b>+${G.trainingBoost}%</b></p><div class="bar"><i style="width:${(G.rep+1)*20}%"></i></div><p class="muted">聲譽提升後，新生候選池擴大、職棒選秀名額增加。</p><h3>📌 本年度重點</h3><ul><li>7-8月：夏季地方大會</li><li>9-10月：秋季大會與地區賽</li><li>11月：職棒選秀、冬訓活動</li><li>2-3月：畢業典禮、春甲選拔</li></ul></aside></div><section class="panel" style="margin-top:9px"><h3>📰 最新事件</h3><div class="log">${G.logs.slice(0,6).map(x=>`<div>▸ ${x}</div>`).join('')}</div></section>`}
function rosterHTML(){return `<section class="panel"><div class="between"><h2>👥 球員名單（${G.players.length}人）</h2><span class="muted">點擊球員查看詳細資料</span></div><div class="tablewrap"><table class="roster"><thead><tr><th>頭像／姓名</th><th>年級</th><th>資質</th><th>守位</th><th>Contact</th><th>長打</th><th>走力</th><th>守備</th><th>名譽度</th><th>綜合</th></tr></thead><tbody>${G.players.slice().sort((a,b)=>a.year-b.year).map(p=>`<tr onclick="playerDetail(${p.id})"><td><canvas id="face${p.id}" width="38" height="42" style="width:30px;height:34px;vertical-align:middle;image-rendering:pixelated"></canvas> ${p.name}</td><td>${p.year}年</td><td>${p.talent}</td><td>${p.pos}</td><td>${p.contact}</td><td>${p.power}</td><td>${p.speed}</td><td>${p.field}</td><td>${p.reputation}</td><td>${calc(p)}</td></tr>`).join('')}</tbody></table></div><p class="muted">點選任何球員列，可查看投球、天花板與養成資訊。</p></section>`}
function trainingHTML(){return `<div class="grid"><section class="panel"><h2>🏋️ 練習訓練</h2><p>每次訓練花費 ¥30,000。能力依資質與天花板微幅成長，避免過快成長。</p><div class="cards">${[['打擊訓練','contact'],['長打訓練','power'],['跑壘訓練','speed'],['守備訓練','field'],['投手訓練','pitch'],['全隊體能','stamina']].map(([n,k])=>`<button onclick="train('${k}')">${n}<small style="display:block;color:#b7cbd9">開始訓練</small></button>`).join('')}</div><h3 style="margin-top:15px">📅 每月安排</h3><button class="primary" onclick="advanceMonth()">訓練完成，前進下一個月</button></section><aside class="panel"><h2>📊 成長原則</h2><p>天才型天花板：90-100（球速最高160km/h）</p><p>平庸型天花板：60-70（球速最高140km/h）</p><p>能力上升依剩餘潛力遞減，日常成長幅度通常為1-2點。</p><p class="muted">投手訓練會提升球速、控球與體力；投球消耗會在比賽中生效。</p></aside></div>`}
function scheduleHTML(){return `<div class="grid"><section class="panel"><h2>📅 賽季日程</h2>${[[4,'入學式與春季練習賽'],[5,'春季練習與校內合宿'],[6,'夏季地方大會備戰'],[7,'夏季地方大會'],[8,'夏季甲子園（地方冠軍限定）'],[9,'秋季地方大會'],[10,'秋季地區大會／冬訓準備'],[11,'職棒選秀大會／冬季特訓'],[12,'冬季自主訓練'],[1,'冬季自主訓練'],[2,'畢業典禮與未來出路'],[3,'春季選拔甲子園']].map(([m,n])=>`<div class="between stat" style="margin:5px 0"><span>${m}月　${n}</span><span class="${G.month===m?'gold':'muted'}">${G.month===m?'◀ 目前':'年度行程'}</span></div>`).join('')}<button class="primary" onclick="advanceMonth()">前進下一個月 ▶</button></section><aside class="panel"><h2>🏆 賽季紀錄</h2><p>夏季地方大會：${G.events.summer||'尚未舉行'}</p><p>秋季地方大會：${G.events.autumn||'尚未舉行'}</p><p>春季選拔：${G.events.spring||'尚未舉行'}</p><p>職棒指名：${G.events.draft||'尚未舉行'}</p><h3>難度變化</h3><p>年度加權係數：×${(1+(G.year-1)*.035).toFixed(2)}</p><p class="muted">電腦球隊會隨年份逐年成長，甲子園對手至少為強豪級。</p></aside></div>`}
function recordsHTML(){return `<section class="panel"><h2>📜 事件紀錄</h2><div class="log">${G.logs.map(x=>`<div>▸ ${x}</div>`).join('')}</div><button onclick="saveGame()">💾 儲存進度</button> <button onclick="loadGame()">📂 載入進度</button> <button class="danger" onclick="if(confirm('確定重新開始？目前未存檔進度將消失。'))location.reload()">重新開始</button></section>`}
function drawFaces(){if(!G)return;G.players.forEach(p=>drawFace('face'+p.id,p));}
function drawFace(id,p){let c=$(id);if(!c)return;let x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let w=c.width,h=c.height,s=Math.max(2,Math.floor(w/16));x.fillStyle='#c8d9d7';x.fillRect(0,0,w,h);let px=(a,b,col,ww=1,hh=1)=>{x.fillStyle=col;x.fillRect(a*s,b*s,ww*s,hh*s)};let skin=p.face.skin,hair=p.face.hair;px(3,2,hair,10,5);px(2,5,hair,2,6);px(12,5,hair,2,5);px(4,4,skin,8,9);px(3,8,skin,2,3);px(11,8,skin,2,3);if(p.face.style===1)px(5,2,hair,7,3);if(p.face.style===2)px(4,1,hair,5,3);if(p.face.style===3)px(8,1,hair,5,4);x.fillStyle='#fff';x.fillRect(5*s,7*s,2*s,2*s);x.fillRect(9*s,7*s,2*s,2*s);x.fillStyle=p.face.eyes===0?'#172b38':p.face.eyes===1?'#31566e':'#6a3d31';x.fillRect(6*s,7*s,s,2*s);x.fillRect(10*s,7*s,s,2*s);px(7,10,'#b66d5d',2,1);px(4,12,'#f7f3e6',8,3);px(3,15,'#254f7e',10,Math.max(1,Math.floor((h/s)-15)));px(4,12,'#d7dce2',8,1);px(5,13,'#b53f45',6,1);if(p.pos==='投手'){px(2,3,'#203d5c',12,2);px(6,1,'#e7e7e0',4,1)}else{px(3,3,'#203d5c',10,2);px(7,2,'#e7e7e0',2,1)}}
function drawDiamond(){let d=$('diamond');if(!d)return;let bases=currentMatch?.bases||[false,false,false];d.innerHTML=`<i class="base b1 ${bases[0]?'on':''}"></i><i class="base b2 ${bases[1]?'on':''}"></i><i class="base b3 ${bases[2]?'on':''}"></i><i class="base home"></i>`}
function openEnrollment(){let n=G.rep<=1?9:G.rep<=3?12:15;G.rookies=Array.from({length:n},()=>newPlayer(1));G.rookies.forEach(p=>{p.contact=clamp(p.contact,25,78);p.power=clamp(p.power,25,78);p.speed=clamp(p.speed,25,78);p.field=clamp(p.field,25,78)});selectedRookies=[];activeTab='home';modal(`<h2>🌸 入學式・新生盲抽</h2><p>本年度候選新生共 ${n} 人，請選擇 6 名加入棒球部。</p><div id="rookieCards" class="cards">${G.rookies.map((p,i)=>`<button class="rookie" id="rook${i}" onclick="toggleRookie(${i})"><canvas id="rookface${i}" width="48" height="56"></canvas><b>${p.name}</b><small>${p.pos}・${p.talent}</small><small>巧打 ${p.contact}／長打 ${p.power}</small><small>走力 ${p.speed}／守備 ${p.field}</small><small>綜合 ${calc(p)}</small></button>`).join('')}</div><p id="rookCount" class="gold">已選 0 / 6</p><button class="primary" style="width:100%" onclick="recruit()">確定招募 6 人</button>`);G.rookies.forEach((p,i)=>drawFace('rookface'+i,p))}
function toggleRookie(i){if(selectedRookies.includes(i))selectedRookies=selectedRookies.filter(x=>x!==i);else if(selectedRookies.length<6)selectedRookies.push(i);let b=$('rook'+i);b.classList.toggle('selected',selectedRookies.includes(i));$('rookCount').textContent=`已選 ${selectedRookies.length} / 6`}
function recruit(){if(selectedRookies.length!==6){alert('請剛好選擇 6 名新生！');return}selectedRookies.forEach(i=>G.players.push(G.rookies[i]));G.players.forEach(p=>p.overall=calc(p));log(`入學式完成：成功招募 ${selectedRookies.length} 名新生。`);closeModal();render()}
function modal(content){$('modalRoot').innerHTML=`<div class="modalback" id="backdrop"><div class="modal">${content}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function playerDetail(id){let p=G.players.find(x=>x.id===id);if(!p)return;modal(`<div class="between"><h2>球員資料卡</h2><button onclick="closeModal()">✕</button></div><div class="player"><canvas id="detailFace" width="64" height="72"></canvas><div><h2>${p.name}</h2>${p.year}年級・${p.pos}<br><span class="gold">${p.talent}</span>　名譽度 ${p.reputation}</div></div><div class="two"><div class="stat">Contact <strong>${p.contact}</strong></div><div class="stat">長打力 <strong>${p.power}</strong></div><div class="stat">走力 <strong>${p.speed}</strong></div><div class="stat">守備力 <strong>${p.field}</strong></div><div class="stat">能力天花板 <strong>${p.cap}</strong></div><div class="stat">綜合能力 <strong>${calc(p)}</strong></div></div>${p.pos==='投手'?`<h3>投手專屬數值</h3><p>球速 ${p.pitchSpeed} km/h　控球 ${p.control}　體力 ${p.stamina}/100</p><p>變化球：${p.pitches.map(x=>x.name+' Lv.'+x.level).join('、')}</p><p>累計投球數：${p.pitchCount}</p>`:''}<p class="muted">能力成長上限受資質限制，訓練以小幅增長為主。</p>`);drawFace('detailFace',p)}
function train(type){if(G.money<30000){alert('資金不足！');return}G.money-=30000;let candidates=G.players.filter(p=>type==='pitch'||type==='stamina'?p.pos==='投手':true);if(!candidates.length)candidates=G.players;let count=type==='stamina'?candidates.length:Math.min(5,candidates.length);for(let p of candidates.slice().sort(()=>Math.random()-.5).slice(0,count)){let stat=type==='pitch'?'pitchSpeed':type==='stamina'?'stamina':type;let gain=Math.random()<.75?1:2;if(['contact','power','speed','field'].includes(stat)){let cap=p.talent==='天才型'?p.cap:Math.min(p.cap,70);p[stat]=clamp(p[stat]+(p[stat]<cap?gain:0),1,cap)}else if(stat==='pitchSpeed')p.pitchSpeed=Math.min(p.talent==='天才型'?160:140,p.pitchSpeed+gain);else p.stamina=clamp(p.stamina+gain)}G.trainingBoost=Math.min(30,G.trainingBoost+1);log(`進行${type==='pitch'?'投手特訓':type==='stamina'?'全隊體能':({contact:'打擊',power:'長打',speed:'跑壘',field:'守備'}[type]||'綜合')}訓練，能力獲得微幅提升。`);render()}
function trainingEvent(){if(G.money<50000){alert('資金不足，特訓需要 ¥50,000。');return}G.money-=50000;G.players.forEach(p=>{let s=pick(['contact','power','speed','field']);let cap=p.talent==='天才型'?p.cap:Math.min(p.cap,70);if(p[s]<cap)p[s]=clamp(p[s]+1,1,cap)});log('全隊特別合宿完成！球員各自獲得少量經驗。');render()}
function advanceMonth(){if(currentMatch){alert('請先完成目前的比賽。');return}G.month++;if(G.month>12){G.month=1;G.year++;G.players.forEach(p=>{if(p.year<3)p.year++})}G.week=1;monthlyEvent();if(G.month===4)openEnrollment();if(G.month===7)startTournament('summer');if(G.month===8&&G.championSummer)startTournament('koshien');if(G.month===9)startTournament('autumn');if(G.month===10){G.autumnScore=rand(0,3);G.springQualified=G.autumnScore>=2;G.events.autumn=G.autumnScore>=2?'地方賽表現優異，取得地區大會機會':'地方賽止步';startTournament('regional')}if(G.month===11){draftEvent();winterEvent()}if(G.month===2)graduation();if(G.month===3&&G.springQualified)startTournament('spring');if(G.month===3&&!G.springQualified)log('春季選拔未獲邀請，持續備戰新賽季。');render()}
function monthlyEvent(){let e=pick(['贊助商提供器材補助','球員在自主訓練中找到手感','校友回校分享比賽經驗','球員參加社區活動，獲得師長讚賞','全隊進行體能恢復','校內舉辦友誼賽']);if(e.includes('補助')){G.money+=rand(50000,180000)}else if(e.includes('手感')){let p=pick(G.players);p.contact=clamp(p.contact+1,1,p.cap);p.reputation=clamp(p.reputation+2,0,100)}else if(e.includes('校友'))G.trainingBoost=Math.min(35,G.trainingBoost+2);else if(e.includes('讚賞'))G.rep=Math.min(4,G.rep+ (Math.random()<.2?1:0));else if(e.includes('恢復'))G.players.filter(p=>p.pos==='投手').forEach(p=>p.stamina=clamp(p.stamina+8));log(e+'。')}
function startTournament(type){let name={summer:'夏季地方大會',koshien:'夏季甲子園大賽',autumn:'秋季地方大會',regional:'秋季地區大會',spring:'春季選拔甲子園大賽'}[type];let strength=G.rep*7+rand(25,43)+Math.floor((G.year-1)*1.8);if(type==='koshien'||type==='spring')strength=Math.max(60,strength);let team=pick(['青森豪農','大阪桐蔭風格學園','京都鳳凰','橫濱明星','仙台青葉','名古屋龍星','沖繩海風','東京帝都']);if((type==='koshien'||type==='spring')&&Math.random()<.24){team='傳奇魔王校・天翔學院';strength=rand(90,100)}let ours=G.players.reduce((a,p)=>a+calc(p),0)/G.players.length;let winChance=Math.max(.12,Math.min(.84,.52+(ours-strength)/110));let won=Math.random()<winChance;currentMatch={type,name,team,strength,ours,round:1,won,bases:[false,false,false],inning:1,scoreUs:0,scoreThem:0,logs:[],active:'bat',paused:false,atbat:0,pitcher:G.players.find(p=>p.pos==='投手'),batter:G.players.find(p=>p.pos!=='投手'),decision:null};matchScreen()}
function matchScreen(){let m=currentMatch;if(!m)return;let pitcher=m.pitcher||G.players.find(p=>p.pos==='投手'),batter=m.batter||G.players[0];modal(`<div class="between"><h2>⚾ ${m.name}</h2><button onclick="forfeitMatch()">離開比賽</button></div><div class="stat" style="text-align:center"><div>${G.school}　VS　${m.team}</div><div class="score">${m.scoreUs}　:　${m.scoreThem}</div><div>第 ${m.inning} 局・${m.active==='bat'?'我方進攻':'我方防守'}　｜　對手強度 ${Math.round(m.strength)}</div></div><div class="matchgrid" style="margin-top:8px"><div class="panel"><h3>我方打者</h3><div class="player"><canvas id="matchBatter" width="48" height="56"></canvas><div>${batter.name}<br>Contact ${batter.contact}<br>長打 ${batter.power}<br>走力 ${batter.speed}</div></div></div><div class="panel"><h3>壘包情報</h3><div class="diamond" id="diamond"><i class="base b1 ${m.bases[0]?'on':''}"></i><i class="base b2 ${m.bases[1]?'on':''}"></i><i class="base b3 ${m.bases[2]?'on':''}"></i><i class="base home"></i></div><div class="diamondlabels">一壘 ${m.bases[0]?'跑者・走力 '+rand(45,80):'空'}<br>二壘 ${m.bases[1]?'跑者・走力 '+rand(45,80):'空'}　 三壘 ${m.bases[2]?'跑者・走力 '+rand(45,80):'空'}</div></div><div class="panel"><h3>對方投手</h3><div class="player"><canvas id="matchPitcher" width="48" height="56"></canvas><div>${m.team}王牌<br>球速 ${Math.min(160,Math.round(m.strength*1.15))} km/h<br>控球 ${Math.round(m.strength*.75)}<br>守備失誤率 ${Math.round((100-Math.min(100,m.strength))*.2+3)}%</div></div></div></div><div class="panel" style="margin-top:8px"><div class="between"><b>${m.active==='bat'?'🎯 進攻指揮':'🧤 防守指揮'}</b><span class="gold">我方投手：${pitcher?.name||'—'}　投球數 ${pitcher?.pitchCount||0}　體力 ${pitcher?.stamina||0}/100</span></div><div class="tactics" style="margin-top:8px">${(m.active==='bat'?[['強振大棒','power'],['確實擊球','contact'],['短打推進','bunt'],['盜壘','steal']]:[['全力投球','full'],['變化球誘敵','curve'],['敬遠（故意四壞）','walk'],['牽制壘包','pickoff']]).map(([n,k])=>`<button onclick="tactic('${k}')">${n}</button>`).join('')}</div><div id="matchLog" class="log" style="margin-top:8px">${m.logs.slice(-5).map(x=>`<div>${x}</div>`).join('')}</div><p class="muted">得點圈或關鍵局數將暫停戰報，等待教練指揮。第6局後低體力會觸發換投警告。</p></div>`);drawFace('matchBatter',batter);drawFace('matchPitcher',pitcher||batter)}
function tactic(k){let m=currentMatch;if(!m)return;let pitcher=m.pitcher||G.players.find(p=>p.pos==='投手'),batter=m.batter||G.players[0];if(m.active==='bat'){if(k==='steal'){if(!m.bases.some(Boolean)){m.logs.push('盜壘指令取消：壘上無人。')}else if(Math.random()<batter.speed/120){m.bases=[true,m.bases[0]||m.bases[1],m.bases[2]||m.bases[1]];m.logs.push(`${batter.name}起跑成功，推進壘包！`)}else{m.logs.push('盜壘遭阻殺，出局！');m.bases=[false,false,false]}}else if(k==='bunt'){m.logs.push('短打推進成功，跑者推進一個壘包。');m.bases=[m.bases[0]||true,m.bases[1]||m.bases[0],m.bases[2]||m.bases[1]]}else{let chance=clamp((batter.contact+(k==='power'?batter.power*.5:10)-(m.strength*.45))/100,.12,.85);if(Math.random()<chance){let hit=Math.random()<(k==='power'?batter.power/140:.18)?2:1;m.logs.push(`${batter.name} 擊出${hit===2?'長打':'安打'}！`);batter.reputation=clamp(batter.reputation+rand(2,5),0,100);if(hit===2&&m.bases.some(Boolean)){m.scoreUs+=1;m.bases=[false,true,false]}else if(m.bases[2]){m.scoreUs++;m.bases=[true,m.bases[0],m.bases[1]]}else m.bases=[true,m.bases[0],m.bases[1]]}else m.logs.push(`${batter.name} 擊球出局，對方投手壓制成功。`)}}else{if(k==='walk'){m.logs.push('教練下達敬遠！打者直接保送一壘。');m.bases=[true,m.bases[0]||m.bases[1],m.bases[2]||m.bases[1]]}else if(k==='pickoff'){if(m.bases.some(Boolean)&&Math.random()<.45){m.logs.push('牽制成功！跑者遭觸殺。');m.bases=[false,m.bases[1],m.bases[2]]}else m.logs.push('牽制未能抓到跑者。')}else{if(pitcher){pitcher.pitchCount+=1;pitcher.stamina=clamp(pitcher.stamina-(k==='full'?5:3),0,100)}let hitChance=clamp((m.strength-(pitcher?.control||50)+(k==='curve'?-12:5))/100,.08,.62);if(Math.random()<hitChance){m.logs.push('對方打者擊出安打！');if(m.bases[2]){m.scoreThem++;m.bases[2]=false}m.bases=[true,m.bases[0],m.bases[1]]}else m.logs.push(k==='full'?'全力投球奏效，對方揮空三振！':'變化球成功誘使打者打成滾地球！')}}if(pitcher&&pitcher.stamina<30&&m.inning>=6){modal(`<h2 class="dangertext">⚠️ 投手體力警告</h2><p>${pitcher.name} 體力只剩 ${pitcher.stamina}/100，能力將大幅衰減！是否更換投手？</p><div class="cards">${G.players.filter(p=>p.pos==='投手'&&p.id!==pitcher.id).map(p=>`<button onclick="changePitcher(${p.id})">${p.name}<small>球速 ${p.pitchSpeed}｜體力 ${p.stamina}</small></button>`).join('')}</div><button onclick="closeModal();continueMatch()">繼續讓他投</button>`);return}m.atbat++;if(m.atbat%2===0){m.inning++;m.active=m.active==='bat'?'field':'bat';if(m.inning>9){finishMatch();return}}if(m.bases[1]||m.bases[2]||m.inning>=7){matchScreen();return}matchScreen()}
function changePitcher(id){currentMatch.pitcher=G.players.find(p=>p.id===id);log(`比賽中更換投手：${currentMatch.pitcher.name} 登板。`);closeModal();matchScreen()}
function continueMatch(){closeModal();currentMatch.pitcher.stamina=clamp(currentMatch.pitcher.stamina-3,0,100);matchScreen()}
function finishMatch(){let m=currentMatch;let win=m.scoreUs>m.scoreThem||m.won;if(m.scoreUs===m.scoreThem){if(Math.random()<.5)m.scoreUs++;else m.scoreThem++}win=m.scoreUs>m.scoreThem||m.won;let name=m.name;log(`${name}結束：${win?'獲勝':'惜敗'}，比分 ${m.scoreUs}:${m.scoreThem}。`);if(m.type==='summer'){G.championSummer=win;G.events.summer=win?'地方大會優勝！':'地方大會止步';if(win){G.rep=Math.min(4,G.rep+1);G.money+=150000}}if(m.type==='koshien'||m.type==='spring'){let rank=win?(Math.random()<.2?'優勝':Math.random()<.5?'準優勝':'四強'):'未能晉級四強';G.events[m.type]=rank;if(['優勝','準優勝','四強'].includes(rank)){G.honors.push({year:G.year,name,rank});awardCeremony(name,rank);}}if(m.type==='autumn'||m.type==='regional'){G.autumnScore=win?G.autumnScore+1:G.autumnScore;G.springQualified=G.autumnScore>=2}if(win&&Math.random()<.5)G.rep=Math.min(4,G.rep+1);currentMatch=null;closeModal();render()}
function forfeitMatch(){if(confirm('要結束這場模擬比賽嗎？')){currentMatch.won=false;currentMatch.scoreUs=0;currentMatch.scoreThem=rand(1,5);finishMatch()}}
function awardCeremony(name,rank){modal(`<div class="ceremony"><div class="trophy">🏆</div><h1>榮耀頒獎典禮</h1><p>第 ${G.year} 年・${name}</p><h2>${G.school}</h2><h1>${rank}</h1><p>以汗水寫下屬於棒球部的歷史</p><p>🏅 學校聲譽：${repName()}　🎖️ 甲子園榮譽：${G.honors.length} 次</p><button class="primary" onclick="closeModal();render()">收下榮耀</button><button onclick="window.print()">列印／截圖分享</button></div>`)}
function draftEvent(){let eligible=G.players.filter(p=>p.year===3&&calc(p)>=78&&p.reputation>=65).sort((a,b)=>calc(b)+b.reputation-(calc(a)+a.reputation));let limit=G.rep<=1?1:G.rep<=3?3:5;let chosen=eligible.slice(0,limit);if(!chosen.length){G.events.draft='本年度無球員獲得指名';log('職棒選秀大會結束，本年度沒有球員達到指名門檻。');return}let results=chosen.map((p,i)=>({p,round:i+1,team:pick(PROTEAMS)}));G.events.draft=`${chosen.length} 名球員獲得指名`;G.money+=chosen.length*200000;G.alumniBoost=5+chosen.length*3;G.players.forEach(p=>{if(p.year<3){p.contact=clamp(p.contact+5,1,p.cap);p.power=clamp(p.power+5,1,p.cap);p.speed=clamp(p.speed+5,1,p.cap);p.field=clamp(p.field+5,1,p.cap);p.spirit=clamp(p.spirit+10,1,100)}});log(`職棒選秀大會：${chosen.length} 名球員獲得指名！學長回娘家，學弟妹能力大幅提升。`);modal(`<div class="ceremony"><div class="trophy">⚡⚾✨</div><h1>職棒選秀大會</h1><p>${G.school}・第 ${G.year} 年</p>${results.map(r=>`<div class="stat" style="margin:8px 0"><div class="tag">第 ${r.round} 輪指名</div><h2>${r.p.name}</h2><p>🎉 ${r.team} 選中！</p><p>${r.p.pos}・綜合能力 ${calc(r.p)}</p></div>`).join('')}<p class="gold">學長回娘家效應啟動！在校生能力提升，鬥志高漲。</p><button class="primary" onclick="closeModal();render()">感受榮耀</button></div>`)}
function winterEvent(){if(G.winterDone&&G.events.winterYear===G.year)return;G.winterDone=true;G.events.winterYear=G.year;let candidates=G.players.filter(p=>p.year<3);modal(`<h2>❄️ 冬季冬訓特別活動</h2><p>選擇一位球員進行冬季專項修煉。守備轉型成功率受守備力影響；投手修球成功率受球速與控球影響。</p><div class="two"><div><label>選擇球員</label><select id="winterPlayer">${candidates.map(p=>`<option value="${p.id}">${p.name}（${p.pos}／守備 ${p.field}）</option>`).join('')}</select></div><div><label>訓練項目</label><select id="winterType"><option value="position">更換守備位置</option><option value="pitch">學習／升級變化球</option></select></div></div><button class="primary" style="width:100%;margin-top:12px" onclick="doWinter()">開始冬訓</button><button style="width:100%;margin-top:6px" onclick="closeModal()">稍後再說</button>`)}
function doWinter(){let p=G.players.find(x=>x.id===+$('winterPlayer').value),type=$('winterType').value;if(!p){closeModal();return}if(type==='position'){let chance=.35+p.field/180;if(Math.random()<chance){p.pos=pick(POS.filter(x=>x!==p.pos));log(`${p.name} 冬訓成功轉型為${p.pos}！`);if(p.pos==='投手'&&!p.pitchSpeed){p.pitchSpeed=rand(115,130);p.control=rand(40,60);p.stamina=rand(50,70);p.pitches=[{name:pick(PITCHES),level:1}]}}else log(`${p.name} 嘗試更換守位未成功，仍保留原守位。`)}else{if(p.pos!=='投手'){alert('請選擇投手學習變化球。');return}let chance=.25+(p.pitchSpeed/160)*.25+(p.control/100)*.25;if(Math.random()<chance){if(p.pitches.length<3&&Math.random()<.5)p.pitches.push({name:pick(PITCHES.filter(x=>!p.pitches.some(y=>y.name===x))),level:1});else{let pitch=pick(p.pitches);pitch.level=Math.min(7,pitch.level+1)}log(`${p.name} 變化球修煉成功！`)}else log(`${p.name} 冬季修煉未能突破，累積了寶貴經驗。`)}closeModal();render()}
function graduation(){let grads=G.players.filter(p=>p.year>=3);if(!grads.length)return;let list=grads.map(p=>({p,job:pick(['考取大學（繼續打棒球）','考取一般大學（專心讀書）','書店老闆','章魚燒攤販','普通上班族','棒球部助教'])}));list.forEach(({p,job})=>{if(job.includes('繼續打棒球')){G.players.filter(x=>x.year<3).forEach(x=>{x.cap=Math.min(100,x.cap+1);x.contact=clamp(x.contact+1,1,x.cap);x.power=clamp(x.power+1,1,x.cap);x.speed=clamp(x.speed+1,1,x.cap);x.field=clamp(x.field+1,1,x.cap)})}else if(job.includes('專心讀書'))G.rep=Math.min(4,G.rep+1);else if(job.includes('書店'))G.trainingBoost=Math.min(40,G.trainingBoost+5);else if(job.includes('章魚燒'))G.players.filter(x=>x.pos==='投手').forEach(x=>x.stamina=clamp(x.stamina+10));else if(job.includes('上班族'))G.money+=rand(50000,180000);else G.trainingBoost=Math.min(50,G.trainingBoost+8)});G.players=G.players.filter(p=>p.year<3);log(`畢業典禮：${list.map(x=>x.p.name+'→'+x.job).join('；')}`);modal(`<h2>🎓 畢業典禮・未來出路諮詢</h2><p>學長姐離開球隊，帶著各自的夢想踏上新旅程。</p>${list.map(x=>`<div class="stat" style="margin:5px 0"><b>${x.p.name}</b>　${x.job}</div>`).join('')}<p class="gold">畢業生的選擇已影響在校球員、學校聲譽與球隊資金。</p><button class="primary" style="width:100%" onclick="closeModal();render()">送別學長姐</button>`)}
function saveGame(){if(!G){alert('尚未開始遊戲');return}localStorage.setItem('eikanSave',JSON.stringify(G));log('遊戲進度已儲存至本機瀏覽器。');alert('存檔成功！');render()}
function loadGame(){let s=localStorage.getItem('eikanSave');if(!s){alert('找不到本機存檔。');return}G=JSON.parse(s);$('setup').classList.add('hidden');$('game').classList.remove('hidden');currentMatch=null;log('已載入本機存檔。');render()}
</script>
<script>
function continueMatch(){closeModal();if(currentMatch&&currentMatch.pitcher)currentMatch.pitcher.stamina=clamp(currentMatch.pitcher.stamina-3,0,100);matchScreen()}
</script>

<style>#money{display:none!important}.top .stat:has(#money){display:none!important}</style>
<script>
const _advanceMonthOriginal=advanceMonth;
function render(){if(!G)return;$('schoolName').textContent=G.school;$('rep').textContent=repName();$('date').textContent='第'+G.year+'年 '+G.month+'月';let v=$('view');if(activeTab==='home')v.innerHTML=homeHTML();else if(activeTab==='roster')v.innerHTML=rosterHTML();else if(activeTab==='training')v.innerHTML=trainingHTML();else if(activeTab==='schedule')v.innerHTML=scheduleHTML();else v.innerHTML=recordsHTML();drawFaces();if(activeTab==='home')drawDiamond()}
function homeHTML(){return '<div class="grid"><section class="panel"><h2>⚾ 球隊總覽</h2><div class="two"><div class="stat"><small>在校球員</small><strong>'+G.players.length+' 人</strong></div><div class="stat"><small>學校聲譽</small><strong>'+repName()+'</strong></div><div class="stat"><small>本月訓練</small><strong>'+(G.trainingUsed?'已完成':'尚未訓練')+'</strong></div><div class="stat"><small>甲子園榮譽</small><strong>'+G.honors.length+' 次</strong></div></div><p class="muted">每月只能訓練一次；訓練後會觸發隨機事件，並列出每位球員的能力變化。</p><div class="row"><button class="primary" onclick="showTab(\'training\')">安排本月訓練</button><button onclick="advanceMonth()">前進下一個月 ▶</button></div><h3>📰 最新事件</h3><div class="log">'+G.logs.slice(0,8).map(x=>'<div>▸ '+x+'</div>').join('')+'</div></section><aside class="panel"><h2>🌟 球隊狀態</h2><p>🏫 學校：'+G.school+'</p><p>👥 球員：'+G.players.length+' 人</p><p>🏅 聲譽：'+repName()+'</p><p>🎯 訓練加成：+'+(G.trainingBoost||0)+'%</p></aside></div>'}
function trainingHTML(){const used=!!G.trainingUsed;return '<div class="grid"><section class="panel"><h2>🏋️ 本月訓練</h2><p>不需要球隊資金。每個月只能選擇一種訓練，全隊會依方向成長，之後觸發隨機事件。</p><div class="cards">'+[['打擊訓練','contact'],['長打訓練','power'],['跑壘訓練','speed'],['守備訓練','field'],['投手訓練','pitch'],['全隊體能','stamina']].map(([n,k])=>'<button '+(used?'disabled':'')+' onclick="train(\''+k+'\')">'+n+'<small style="display:block;color:#b7cbd9">'+(used?'本月已完成':'安排本月訓練')+'</small></button>').join('')+'</div><h3 style="margin-top:15px">月份管理</h3><button class="primary" onclick="advanceMonth()">前進下一個月 ▶</button><p class="muted">'+(used?'本月訓練已完成。':'尚未進行本月訓練。')+'</p></section><aside class="panel"><h2>📊 成長原則</h2><p>訓練會顯示每名球員實際提升的能力。</p><p>訓練後隨機事件提供三種選項，不同選擇會影響打擊、守備、球速、控球、體力、鬥志或名譽。</p></aside></div>'}
function train(type){if(!G)return;if(G.trainingUsed){alert('本月已訓練過，請下個月再安排。');return}G.trainingUsed=true;G.pendingTrainingBefore={};G.players.forEach(p=>G.pendingTrainingBefore[p.id]={contact:p.contact,power:p.power,speed:p.speed,field:p.field,pitchSpeed:p.pitchSpeed,control:p.control,stamina:p.stamina,spirit:p.spirit,reputation:p.reputation});const cap=p=>p.talent==='天才型'?p.cap:Math.min(p.cap,70);G.players.forEach(p=>{let n=Math.random()<.7?1:2;if(['contact','power','speed','field'].includes(type))p[type]=Math.min(cap(p),p[type]+n);else if(type==='pitch'&&p.pos==='投手'){p.pitchSpeed=Math.min(p.talent==='天才型'?160:140,p.pitchSpeed+n);p.control=Math.min(100,(p.control||35)+1)}else if(type==='stamina'){if(p.pos==='投手')p.stamina=Math.min(100,p.stamina+n);else p.spirit=Math.min(100,p.spirit+1)}});G.trainingBoost=Math.min(30,(G.trainingBoost||0)+1);const ev=[{title:'校友回校指導',desc:'選擇校友協助的方向。',opts:[['指導投手','投手球速與控球上升',()=>G.players.filter(p=>p.pos==='投手').forEach(p=>{p.pitchSpeed=Math.min(p.talent==='天才型'?160:140,p.pitchSpeed+1);p.control=Math.min(100,(p.control||35)+2)})],['加強守備','全隊守備提升',()=>G.players.forEach(p=>p.field=Math.min(cap(p),p.field+1))],['分享比賽心得','全隊鬥志提升，聲譽有機會提升',()=>{G.players.forEach(p=>p.spirit=Math.min(100,p.spirit+4));if(Math.random()<.35)G.rep=Math.min(4,G.rep+1)}]]},{title:'雨天訓練調整',desc:'天氣影響訓練安排，選擇替代方案。',opts:[['室內揮棒','部分球員打擊提升',()=>G.players.slice().sort(()=>Math.random()-.5).slice(0,5).forEach(p=>p.contact=Math.min(cap(p),p.contact+1))],['影片戰術分析','全隊鬥志提升，部分球員名譽提升',()=>{G.players.forEach(p=>p.spirit=Math.min(100,p.spirit+2));G.players.slice(0,3).forEach(p=>p.reputation=Math.min(100,p.reputation+2))}],['休息恢復','投手體力恢復，全隊鬥志提升',()=>{G.players.filter(p=>p.pos==='投手').forEach(p=>p.stamina=Math.min(100,p.stamina+8));G.players.forEach(p=>p.spirit=Math.min(100,p.spirit+3))}]]},{title:'打擊教練提出加練',desc:'選擇球員接下來的練習方式。',opts:[['強化揮棒','部分球員打擊提升，但少數鬥志下降',()=>G.players.slice().sort(()=>Math.random()-.5).slice(0,4).forEach(p=>{p.contact=Math.min(cap(p),p.contact+1);if(Math.random()<.3)p.spirit=Math.max(1,p.spirit-2)})],['選球與耐心','部分球員打擊與鬥志提升',()=>G.players.slice(0,4).forEach(p=>{p.contact=Math.min(cap(p),p.contact+1);p.spirit=Math.min(100,p.spirit+2)})],['提早收操','全隊鬥志提升，投手體力恢復',()=>{G.players.forEach(p=>p.spirit=Math.min(100,p.spirit+4));G.players.filter(p=>p.pos==='投手').forEach(p=>p.stamina=Math.min(100,p.stamina+4))}]]}][rand(0,2)];window._monthTrainingEvent=ev;modal('<h2>🎲 訓練後事件：'+ev.title+'</h2><p>'+ev.desc+'</p><div class="grid">'+ev.opts.map((o,i)=>'<section class="panel"><h3>'+o[0]+'</h3><p>'+o[1]+'</p><button class="primary" style="width:100%" onclick="finishTrainingEvent('+i+')">選擇此方案</button></section>').join('')+'</div>');log('完成本月訓練，觸發事件：'+ev.title+'。');render()}
function finishTrainingEvent(i){const e=window._monthTrainingEvent;if(!e||!e.opts[i])return;e.opts[i][2]();log('訓練事件選擇：'+e.opts[i][0]+'。');closeModal();const before=G.pendingTrainingBefore||{},labels=[['contact','打擊'],['power','長打'],['speed','走力'],['field','守備'],['pitchSpeed','球速'],['control','控球'],['stamina','體力'],['spirit','鬥志'],['reputation','名譽']];const rows=G.players.map(p=>{const b=before[p.id]||{},a=[];labels.forEach(([k,l])=>{let d=(p[k]||0)-(b[k]||0);if(d)a.push(l+(d>0?' +':' ')+d)});return a.length?'<div class="stat" style="margin:5px 0"><b>'+p.name+'</b><div class="event">'+a.join('、')+'</div></div>':''}).filter(Boolean).join('');G.pendingTrainingBefore=null;modal('<h2>📈 本月球員成長報告</h2><p class="gold">'+e.title+'／'+e.opts[i][0]+'</p><p>以下是本次訓練與事件前後，實際改變的能力。</p><div class="tablewrap">'+(rows||'<p class="muted">本次沒有能力數值變化。</p>')+'</div><button class="primary" style="width:100%;margin-top:10px" onclick="closeModal();showTab(\'training\')">完成</button>');render()}
function advanceMonth(){G.trainingUsed=false;_advanceMonthOriginal()}
function monthlyEvent(){const e=pick(['球員自主訓練找到手感','校友回校分享經驗','球員參與社區活動','全隊進行體能恢復','校內舉辦友誼賽']);if(e.includes('手感')){const p=pick(G.players);p.contact=clamp(p.contact+1,1,p.cap)}else if(e.includes('校友'))G.trainingBoost=Math.min(35,(G.trainingBoost||0)+2);else if(e.includes('社區'))G.rep=Math.min(4,G.rep+(Math.random()<.2?1:0));else if(e.includes('恢復'))G.players.filter(p=>p.pos==='投手').forEach(p=>p.stamina=clamp(p.stamina+8,1,100));log(e+'。')}
</script>
