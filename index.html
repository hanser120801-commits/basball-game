 {name:'魔鬼教練特別課',desc:'個別球員接受高風險指導。',stat:'random',chance:27,gain:4,loss:2,who:'any'},
 {name:'傳說中的秘密菜單',desc:'隨機專項突破，成功收益最高。',stat:'random',chance:16,gain:6,loss:2,who:'any'},
 {name:'隊長帶隊自主練習',desc:'全隊互相指導、穩定成長。',stat:'team',chance:74,gain:1,loss:0,who:'any'},
 {name:'校友職棒選手返校',desc:'校友分享經驗，提升全隊鬥志。',stat:'team',chance:36,gain:2,loss:1,who:'any'},
 {name:'極限守備輪轉',desc:'全隊進行高強度守備輪轉。',stat:'teamField',chance:39,gain:2,loss:1,who:'any'},
 {name:'全隊特打日',desc:'全隊打者集中練習擊球。',stat:'teamBat',chance:43,gain:2,loss:1,who:'batter'}
 ];
 const options=[];const bag=pool.slice();
 while(options.length<4&&bag.length)options.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0]);
 window.__trainingOptions=options;
 modal('<h2>🎲 今日特訓事件 <small style="font-size:12px;color:#5b9">隨機事件系統 v3</small></h2><p>每次開啟都會從 18 種事件中隨機抽出 4 種，訓練免費。成功率越低，成功時成長越高；失敗可能無變化或小幅退步。</p>'+options.map((e,i)=>'<div class="stat" style="margin:9px 0;padding:12px"><b>'+e.name+'</b><p>'+e.desc+'</p><p>成功率 <b class="gold">'+e.chance+'%</b>｜成功成長 +'+e.gain+'｜失敗'+(e.loss?'可能下降 '+e.loss:'不會下降')+'</p><button class="primary" style="width:100%" onclick="runTrainingEvent('+i+')">挑戰這項特訓</button></div>').join('')+'<button style="width:100%" onclick="closeModal()">先不訓練</button>');
};
window.runTrainingEvent=function(index){
 const e=(window.__trainingOptions||[])[index];if(!e||!G)return;
 const before=G.players.map(p=>({id:p.id,name:p.name,overall:calc(p)}));
 const success=Math.random()*100<e.chance;const changed=[];
 const pickOne=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
 const adjustStat=(p,stat,delta)=>{
  const old=Number(p[stat])||0;
  let cap=Number(p.cap)||100;
  if(stat==='pitchSpeed')cap=Math.min(cap,150);
  if(stat==='control')cap=Math.min(cap,100);
  if(stat==='spirit')cap=Math.min(cap,100);
  const next=clamp(old+delta,0,cap);p[stat]=next;
  if(next!==old)changed.push({name:p.name,stat:({contact:'打擊',power:'長打',speed:'速度',field:'守備',control:'控球',pitchSpeed:'球速',spirit:'精神'}[stat]||stat),delta:next-old});
 };
 const targets=e.who==='pitcher'?G.players.filter(p=>p.pos==='投手'):e.who==='fielder'?G.players.filter(p=>p.pos!=='投手'):e.who==='batter'?G.players.filter(p=>p.pos!=='投手'):G.players;
 const chosen=(e.stat==='team'||e.stat==='teamField'||e.stat==='teamBat'||e.stat==='spirit')?targets: [pickOne(targets.length?targets:G.players)].filter(Boolean);
 for(const p of chosen){
  let stat=e.stat;
  if(stat==='random')stat=pickOne(['contact','power','speed','field']);
  if(stat==='team')stat='spirit';
  if(stat==='teamField')stat='field';
  if(stat==='teamBat')stat='contact';
  const loss=success?0:(e.loss&&Math.random()<0.45?-e.loss:0);
  let delta=success?e.gain:loss;
  if(e.stat==='team'||e.stat==='teamField'||e.stat==='teamBat')delta=success?Math.max(1,Math.ceil(e.gain/2)):(Math.random()<0.2?-1:0);
  adjustStat(p,stat,delta);
 }
 G.players.forEach(p=>p.overall=calc(p));
 const overall=G.players.map(p=>{const b=before.find(x=>x.id===p.id);return {name:p.name,before:b?b.overall:0,after:calc(p),delta:calc(p)-(b?b.overall:0)}}).filter(x=>x.delta!==0);
 const detail=changed.length?changed.map(x=>x.name+'｜'+x.stat+' '+(x.delta>0?'+':'')+x.delta).join('、'):'本次沒有個別能力數值變化。';
 log(e.name+(success?'成功！':'失敗。')+' '+detail);
 modal('<style>@keyframes trainingPopV3{0%{transform:scale(.25) rotate(-12deg);opacity:0}65%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes trainingBounceV3{to{transform:translateY(-10px) scale(1.08)}}.training-result-v3{text-align:center;padding:22px 8px;animation:trainingPopV3 .7s}.training-result-v3 .emoji{font-size:58px;animation:trainingBounceV3 .45s infinite alternate}.training-progress-v3{height:9px;background:#ddd;border-radius:8px;overflow:hidden;margin:18px 0}.training-progress-v3 i{display:block;height:100%;background:'+(success?'#42b86b':'#df5656')+';animation:trainingProgressV3 1.6s ease-out}@keyframes trainingProgressV3{from{width:0}to{width:100%}}</style><div class="training-result-v3"><div class="emoji">'+(success?'🎉⚾✨':'💥⚾😵')+'</div><h2 class="'+(success?'gold':'dangertext')+'">'+(success?'特訓成功！':'特訓失敗……')+'</h2><h3>'+e.name+'</h3><p>'+e.desc+'</p><p>成功率 '+e.chance+'%｜本次結果：'+(success?'成功':'失敗')+'</p><div class="training-progress-v3"><i></i></div><p>'+(success?'教練正在確認訓練成果……':'正在確認球員狀態……')+'</p></div>');
 setTimeout(function(){
  modal('<h2>📊 球員整體能力變化</h2><p>'+e.name+'｜'+(success?'訓練成功':'訓練失敗')+'</p><div class="stat">'+(overall.length?overall.map(x=>x.name+'：整體 '+x.before+' → '+x.after+'（'+(x.delta>0?'+':'')+x.delta+'）').join('<br>'):'本次球員整體評分沒有變化。')+'</div><div class="stat" style="margin-top:8px"><b>個別能力變化</b><p>'+detail+'</p></div><button class="primary" style="width:100%;margin-top:10px" onclick="closeModal();showTab(&quot;training&quot;)">完成</button>');
 },2100);
};

})();
</script>

<script>
/* 遊戲內匯出 PNG：不依賴 Android 系統截圖快捷鍵 */
window.screenshotGame = async function(){
 const btn=document.getElementById('screenshotBtn');
 const target=document.getElementById('game');
 if(!target||target.classList.contains('hidden')){alert('請先進入遊戲，再匯出截圖。');return;}
 // 匯出整個頁面，讓覆蓋在遊戲上的事件選擇／結果動畫也能被截入。
 const captureTarget=document.body;
 const oldText=btn?btn.textContent:'';
 if(btn){btn.disabled=true;btn.textContent='正在製作 PNG…';}
 try{
  if(!window.html2canvas){
   await new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload=resolve;script.onerror=()=>reject(new Error('截圖工具載入失敗，請確認網路連線後重試。'));
    document.head.appendChild(script);
   });
  }
  const canvas=await window.html2canvas(captureTarget,{backgroundColor:'#091626',scale:2,useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,captureTarget.scrollWidth),windowHeight:Math.max(document.documentElement.clientHeight,captureTarget.scrollHeight),scrollX:0,scrollY:0});
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('圖片產生失敗，請再試一次。');
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='榮冠棒球學校模擬器-'+new Date().toISOString().slice(0,10)+'.png';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  alert('截圖 PNG 已匯出。若手機沒有自動下載，請到瀏覽器的下載項目查看。');
 }catch(err){alert('無法匯出截圖：'+(err&&err.message?err.message:'未知錯誤')+'\n也可以嘗試用 Chrome 開啟遊戲後再操作。');}
 finally{if(btn){btn.disabled=false;btn.textContent=oldText||'📸 匯出遊戲截圖';}}
};
</script>

<script>
/* 最後一道保險：每次實際開啟賽前先發視窗，都先同步本機最新打線到遊戲狀態。 */
(function(){
 const _lineupSetupFinal=lineupSetup;
 lineupSetup=function(){
  if(G){
   try{
    const x=JSON.parse(localStorage.getItem('eikanSavedLineup')||'null');
    if(x&&Array.isArray(x.lineup)&&x.lineup.length===9&&(!x.school||x.school===(G.school||''))){
     const eligible=G.players.filter(p=>p.pos!=='投手');
     const resolved=x.lineup.map(id=>eligible.find(p=>String(p.id)===String(id))).filter(Boolean);
     if(resolved.length===9&&new Set(resolved.map(p=>String(p.id))).size===9){
      G.savedLineup=resolved.map(p=>p.id);
      if(x.pitcherId!=null)G.savedPitcherId=x.pitcherId;
     }
    }
   }catch(e){}
  }
  return _lineupSetupFinal.apply(this,arguments);
 };
})();
</script>

<script>
/* 先發打線持久化修正：覆蓋所有舊版 setup/confirm 定義，保存實際 DH 棒次與八名守備球員。 */
(function(){
  const STORE_KEY='eikanSavedLineup';
  function readSaved(){
    try{
      const x=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
      if(!x||!Array.isArray(x.lineup)||x.lineup.length!==9)return null;
      if(x.school&&x.school!==(G.school||''))return null;
      const ids=x.lineup.map(Number);
      if(ids.some(n=>!Number.isFinite(n))||new Set(ids).size!==9)return null;
      return {...x,lineup:ids};
    }catch(e){return null}
  }
  function validSaved(x){
    if(!x||!G||!Array.isArray(G.players))return null;
    const byId=id=>G.players.find(p=>String(p.id)===String(id));
    const players=x.lineup.map(byId);
    if(players.some(p=>!p))return null;
    const dhId=Number(x.dhId!=null?x.dhId:(x.lineupDH!=null?x.lineupDH:x.lineup[Number(x.dhOrder||9)-1]));
    const dh=byId(dhId);
    if(!dh||!x.lineup.some(id=>String(id)===String(dhId)))return null;
    const field=x.lineup.filter(id=>String(id)!==String(dhId)).map(byId);
    if(field.length!==8||field.some(p=>!p||p.pos==='投手')||new Set(field.map(p=>p.pos)).size!==8)return null;
    return {lineup:x.lineup,fieldIds:field.map(p=>p.id),dhId:dh.id,dhOrder:Math.max(1,Math.min(9,Number(x.dhOrder)||x.lineup.findIndex(id=>String(id)===String(dhId))+1)),pitcherId:x.pitcherId};
  }
  const previousSetup=lineupSetup;
  lineupSetup=function(){
    const result=previousSetup.apply(this,arguments);
    const x=validSaved(readSaved());
    if(!x)return result;
    const set=(id,val)=>{const el=$(id);if(el)el.value=String(val)};
    x.fieldIds.forEach((id,i)=>set('lineup'+i,id));
    set('lineupDH',x.dhId);
    set('dhBatOrder',x.dhOrder);
    const order=$('dhBatOrder');
    if(order)order.dispatchEvent(new Event('change',{bubbles:true}));
    const sp=$('starterPitcher');
    if(sp&&x.pitcherId!=null&&G.players.some(p=>String(p.id)===String(x.pitcherId)&&p.pos==='投手'))sp.value=String(x.pitcherId);
    return result;
  };
  confirmLineup=function(){
    const m=currentMatch,sp=$('starterPitcher');
    if(!m||!sp){alert('請先選擇先發投手。');return}
    const pitcher=G.players.find(p=>String(p.id)===String(sp.value));
    const fieldIds=Array.from({length:8},(_,i)=>{const e=$('lineup'+i);return e?Number(e.value):NaN});
    const dhEl=$('lineupDH'),dhOrderEl=$('dhBatOrder');
    const dhId=dhEl?Number(dhEl.value):NaN;
    const dhOrder=Math.max(1,Math.min(9,Number(dhOrderEl&&dhOrderEl.value)||9));
    const field=fieldIds.map(id=>G.players.find(p=>Number(p.id)===id));
    const dh=G.players.find(p=>Number(p.id)===dhId);
    if(!pitcher){alert('找不到所選的先發投手，請重新選擇。');return}
    if(field.some(p=>!p)||!dh){alert('請確認八名守備球員與 DH 都已選擇。');return}
    if(new Set([...fieldIds,dhId]).size!==9){alert('先發九人不可重複，DH 必須是八名守備球員以外的球員。');return}
    if(field.some(p=>p.pos==='投手')){alert('八個守備位置請選擇野手；投手只有在被選為 DH 時才可打擊。');return}
    const positions=field.map(p=>p.pos);
    if(new Set(positions).size!==8){alert('守備位置不可重複，請確認八個守備位置各不相同。');return}
    const lineup=fieldIds.slice();lineup.splice(dhOrder-1,0,dhId);
    m.pitcher=pitcher;m.lineup=lineup;m.dhId=dhId;m.dhActive=true;m.dhPitcherId=dhId===pitcher.id?pitcher.id:null;m.dhVacant=false;m.dhLineupIndex=dhOrder-1;
    m.lineupIndex=0;m.batter=G.players.find(p=>String(p.id)===String(lineup[0]));m.usedIds=[...new Set([...lineup,pitcher.id])];m.active='bat';m.half='top';m.inning=1;m.outs=0;m.bases=[null,null,null];
    G.savedLineup=lineup.slice();G.savedPitcherId=pitcher.id;
    const payload={lineup:lineup,pitcherId:pitcher.id,dhId:dhId,dhOrder:dhOrder,school:G.school||'',savedAt:Date.now()};
    try{localStorage.setItem(STORE_KEY,JSON.stringify(payload));}catch(e){alert('瀏覽器阻擋了本機儲存；本次遊戲仍會使用這份打線，但重新開啟後可能無法保留。');}
    if(!Array.isArray(m.logs))m.logs=[];
    m.logs.push('先發打線已保存：下一場將自動沿用九棒順序、DH 棒次與先發投手。');
    matchScreen();
  };
})();
</script>
